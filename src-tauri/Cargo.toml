[package]
name = "local-ai-desk-2"
version = "1.0.0"
description = "A private, local-first AI workspace for macOS and Windows"
authors = ["Local AI Desk contributors"]
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/eliagentili/local-ai-desk"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "local_ai_desk_2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
blake3 = "1.8.6"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3.33"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39.6"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2.10.1"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["io"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "8.6.0", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
