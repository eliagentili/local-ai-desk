name: Desktop CI and release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags:
      - "v*"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  engine-tests:
    name: Engine tests · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate macOS bootstrap syntax
        if: runner.os == 'macOS'
        run: zsh -n engine/scripts/bootstrap-macos.sh
      - name: Validate Windows bootstrap syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Tokens = $null
          $Errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'engine/scripts/bootstrap-windows.ps1'),
            [ref]$Tokens,
            [ref]$Errors
          ) | Out-Null
          if ($Errors.Count -gt 0) {
            $Errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r engine/requirements-core.txt httpx
      - name: Test engine bridge
        env:
          PYTHONPATH: engine
          LOCAL_AI_ENGINE_HOME: ${{ runner.temp }}/local-ai-engine-tests
        run: python -m unittest discover -s engine/tests -v

  desktop:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            platform: macos-latest
            rust_targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - label: Windows x64
            platform: windows-latest
            rust_targets: ""
            args: --bundles nsis,msi
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}
          components: rustfmt, clippy
      - name: Install frontend dependencies
        run: npm ci
      - name: Validate frontend
        run: npm run build
      - name: Format native core
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Lint native core
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Test native core
        working-directory: src-tauri
        run: cargo test
      - name: Build native installers
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          APPLE_SIGNING_IDENTITY: "-"
        with:
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "local-ai-desk-2-[platform]-[arch]-[bundle]"

  sbom:
    name: Source SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          artifact-name: local-ai-desk-source.spdx.json
          output-file: local-ai-desk-source.spdx.json
          upload-artifact: true
          upload-release-assets: false

  release:
    name: Publish GitHub prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [engine-tests, desktop, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: local-ai-desk-2-*
          path: downloaded/installers
      - name: Download SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: local-ai-desk-source.spdx.json
          path: downloaded/sbom
      - name: Prepare release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          while IFS= read -r -d '' asset; do
            cp "$asset" release-assets/
          done < <(find downloaded -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.spdx.json' \) -print0)
          test "$(find release-assets -type f | wc -l)" -ge 4
          (cd release-assets && sha256sum -- * > SHA256SUMS.txt)
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --verify-tag \
            --prerelease \
            --title "Local AI Desk 2 ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes/v0.3.0-beta.1.md
