name: Desktop CI and release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags:
      - "v*"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  engine-tests:
    name: Engine tests · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate macOS bootstrap syntax
        if: runner.os == 'macOS'
        run: zsh -n engine/scripts/bootstrap-macos.sh
      - name: Validate Windows bootstrap syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Tokens = $null
          $Errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'engine/scripts/bootstrap-windows.ps1'),
            [ref]$Tokens,
            [ref]$Errors
          ) | Out-Null
          if ($Errors.Count -gt 0) {
            $Errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements-core.txt
      - name: Install test dependencies
        run: python -m pip install -r engine/requirements-core.txt httpx
      - name: Test engine bridge
        env:
          PYTHONPATH: engine
          LOCAL_AI_ENGINE_HOME: ${{ runner.temp }}/local-ai-engine-tests
        run: python -m unittest discover -s engine/tests -v

  desktop:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            platform: macos-latest
            rust_targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
            updater_artifact: local-ai-desk-2-darwin-aarch64-updater
            updater_paths: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          - label: Windows x64
            platform: windows-latest
            rust_targets: ""
            args: --bundles nsis,msi
            updater_artifact: local-ai-desk-2-windows-x64-updater
            updater_paths: |
              src-tauri/target/release/bundle/nsis/*.exe.sig
              src-tauri/target/release/bundle/msi/*.msi.sig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.label }}
      - name: Install frontend dependencies
        run: npm ci
      - name: Type-check frontend
        run: npm run check
      - name: Validate frontend
        run: npm run build
      - name: Test signed release manifest
        run: npm run test:release
      - name: Format native core
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Lint native core
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Test native core
        working-directory: src-tauri
        run: cargo test
      - name: Verify updater signing secrets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
      - name: Build native installers
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          args: ${{ matrix.args }} ${{ startsWith(github.ref, 'refs/tags/v') && '--config src-tauri/tauri.updater.conf.json' || '' }}
          uploadWorkflowArtifacts: true
          uploadUpdaterSignatures: true
          workflowArtifactNamePattern: "local-ai-desk-2-[platform]-[arch]-[bundle]"
      - name: Upload signed updater payloads
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.updater_artifact }}
          path: ${{ matrix.updater_paths }}
          if-no-files-found: error
          retention-days: 7

  sbom:
    name: Source SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          artifact-name: local-ai-desk-source.spdx.json
          output-file: local-ai-desk-source.spdx.json
          upload-artifact: true
          upload-release-assets: false

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [engine-tests, desktop, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # A tag that disagrees with the compiled version makes every client see an
      # update that installs the same build, forever. Fail before publishing.
      - name: Verify version coherence with the tag
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
            const conf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
            const cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8").match(/^version = "(.+)"/m)[1];
            if (new Set([tag, pkg, conf, cargo]).size !== 1) {
              console.error("version mismatch", { tag, pkg, conf, cargo });
              process.exit(1);
            }
            console.log("versions agree:", tag);
          '
      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: local-ai-desk-2-*
          path: downloaded/installers
      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: local-ai-desk-source.spdx.json
          path: downloaded/sbom
      - name: Prepare release assets and checksums
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_NOTES_FILE: .github/release-notes/${{ github.ref_name }}.md
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/prepare-release-assets.mjs downloaded release-assets
      # A rotated signing secret would otherwise ship a release that no client
      # can install, because the app only trusts the public key compiled into it.
      - name: Verify updater signatures against the shipped public key
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y minisign
          node -e 'process.stdout.write(Buffer.from(JSON.parse(require("fs").readFileSync("src-tauri/tauri.conf.json","utf8")).plugins.updater.pubkey,"base64").toString())' > updater.pub
          for asset in Local-AI-Desk-macOS-Apple-Silicon.app.tar.gz Local-AI-Desk-Windows-x64-Setup.exe; do
            base64 -d "release-assets/$asset.sig" > "$asset.minisig"
            minisign -V -p updater.pub -x "$asset.minisig" -m "release-assets/$asset"
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes_file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes_file" ]]; then
            notes_args=(--notes-file "$notes_file")
          else
            notes_args=(--generate-notes)
          fi
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --verify-tag \
            --latest \
            --title "Local AI Desk 2 ${GITHUB_REF_NAME#v}" \
            "${notes_args[@]}"
