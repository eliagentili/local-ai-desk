name: Security

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  rust-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file src-tauri/Cargo.lock

  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pip-audit==2.10.1 uv==0.12.2
      - run: python -m pip_audit --no-deps -r engine/requirements-runtime-macos.lock
      - run: python -m pip_audit --no-deps -r engine/requirements-runtime-windows.lock
      - name: Audit the headless translation environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv --without-pip .translation-audit
          uv pip install --python .translation-audit/bin/python --require-hashes -r engine/requirements-translation-macos.lock
          uv pip uninstall --python .translation-audit/bin/python gradio gradio-client gradio-i18n gradio-pdf
          uv pip install --python .translation-audit/bin/python --require-hashes -r engine/requirements-translation-overrides.lock
          .translation-audit/bin/python -c 'from pdf2zh_next.high_level import do_translate_async_stream'
          python -m pip_audit --path .translation-audit/lib/python3.12/site-packages
