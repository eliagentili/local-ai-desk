name: Security

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  rust-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file src-tauri/Cargo.lock

  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            engine/requirements-runtime-macos.lock
            engine/requirements-runtime-windows.lock
            engine/requirements-translation-macos.lock
            engine/requirements-translation-overrides.lock
      - run: python -m pip install pip-audit==2.10.1 uv==0.12.2
      - run: python -m pip_audit --no-deps -r engine/requirements-runtime-macos.lock
      - run: python -m pip_audit --no-deps -r engine/requirements-runtime-windows.lock
      - name: Audit the headless translation environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv --without-pip .translation-audit
          uv pip install --python .translation-audit/bin/python --require-hashes -r engine/requirements-translation-macos.lock
          uv pip uninstall --python .translation-audit/bin/python gradio gradio-client gradio-i18n gradio-pdf
          uv pip install --python .translation-audit/bin/python --require-hashes -r engine/requirements-translation-overrides.lock
          .translation-audit/bin/python -c 'from pdf2zh_next.high_level import do_translate_async_stream'
          python -m pip_audit --path .translation-audit/lib/python3.12/site-packages
