name: Segnala un bug
description: Fornisci una riproduzione senza dati privati.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Non allegare documenti privati. Per vulnerabilità usa la segnalazione privata nella scheda Security.
  - type: input
    id: version
    attributes:
      label: Versione
      placeholder: 0.3.0-beta.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Piattaforma
      options: [macOS Apple Silicon, Windows x64]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passaggi per riprodurre
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Risultato atteso e risultato effettivo
    validations:
      required: true

